<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unity Evolv</title>
    <meta
      name="description"
      content="Unity Evolv builds products with AI, and open-sources the foundations they run on."
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script>
      // Applied before first paint, so a viewer who chose the light theme never
      // sees a dark flash. The document starts on dark because the brand is
      // dark-first; this only narrows it to a remembered choice.
      try {
        const stored = localStorage.getItem('ue-theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch {
        // Private windows and blocked site data throw on access. The dark
        // default in the markup above is already correct, so there is nothing
        // to recover from.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
