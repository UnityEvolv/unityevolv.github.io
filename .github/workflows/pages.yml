name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and a run in progress is allowed to finish:
# cancelling a half-finished Pages deployment can leave the site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs for pull requests too, where it is the gate rather than a deployment.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build and prerender
        run: npm run build
        env:
          # Set this as a repository variable once the form service is chosen
          # (KAN-18). Until it is, the contact form says so rather than
          # pretending to send.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}

      - name: Check the deployment is publishable
        run: node scripts/check-dist.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
